name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Install dotnet-coverage
      run: dotnet tool install --global dotnet-coverage

    - name: Test
      run: dotnet-coverage collect --output ./coverage/coverage.cobertura.xml --output-format cobertura "dotnet test --no-build --verbosity normal"

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/**/coverage.cobertura.xml

    - name: Report coverage
      run: |
        LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' coverage/coverage.cobertura.xml | head -1)
        echo "Line coverage: $LINE_RATE"

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('src/frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      working-directory: src/frontend
      run: npm ci

    - name: Lint
      working-directory: src/frontend
      run: npm run lint

    - name: Test
      working-directory: src/frontend
      run: npm run test

    - name: Build
      working-directory: src/frontend
      run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [build, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -f Dockerfile -t heum-server:${{ github.sha }} .
